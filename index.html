<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Unit Converter App</h1>

        <div class="converter-section">
            <h2>Temperature</h2>
            <input type="number" id="temp-input" placeholder="Enter value">
            <select id="temp-direction">
                <option value="celsiusToFahrenheit">Celsius → Fahrenheit</option>
                <option value="fahrenheitToCelsius">Fahrenheit → Celsius</option>
            </select>
            <button onclick="convertTemp()">Convert</button>
            <p id="temp-result" class="result"></p>
        </div>

        <div class="converter-section">
            <h2>Distance</h2>
            <input type="number" id="dist-input" placeholder="Enter value">
            <select id="dist-direction">
                <option value="kmToMiles">Kilometres → Miles</option>
                <option value="milesToKm">Miles → Kilometres</option>
            </select>
            <button onclick="convertDistance()">Convert</button>
            <p id="dist-result" class="result"></p>
        </div>

        <div class="converter-section">
            <h2>Weight</h2>
            <input type="number" id="weight-input" placeholder="Enter value">
            <select id="weight-direction">
                <option value="kgToLbs">Kilograms → Pounds</option>
                <option value="lbsToKg">Pounds → Kilograms</option>
            </select>
            <button onclick="convertWeight()">Convert</button>
            <p id="weight-result"
        <script src="converter.js"></script>
    </body>
</html>
